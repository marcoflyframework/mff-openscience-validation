name: Sync stats from marcofly.app

# Aggiorna DATA/stats.json + DATA/supporters.json + DATA/submissions.csv
# dal sito MFF ogni 24 ore. Commit automatico se ci sono cambiamenti.
#
# ⚠️ PERCHÉ QUESTO FILE È STATO RISCRITTO (2026-08-03).
# La versione precedente aveva, su ogni fetch:
#     curl -fsSL ... || { echo "::warning::Failed ... Skipping."; exit 0; }
# `exit 0` fa uscire la shell dello step con successo, quindi il job risultava
# VERDE anche quando non scaricava niente. I tre endpoint del sito erano andati
# in 404 col passaggio alla v2 e questo workflow ha continuato a girare ogni
# notte dichiarando «success» per settimane, mentre DATA/ restava fermo al
# segnaposto del 12 giugno e le submission vere si accumulavano in produzione.
#
# Un segno di spunta verde che certifica che non è successo niente è peggio di
# un rosso: un rosso lo guardi. Da qui in poi, se un fetch fallisce il job
# FALLISCE — e GitHub manda la notifica.

on:
  schedule:
    # Ogni giorno alle 03:00 UTC (04:00/05:00 Roma)
    - cron: "0 3 * * *"
  workflow_dispatch:  # Permette trigger manuale dalla UI GitHub

permissions:
  contents: write  # Per commit automatico

env:
  BASE_URL: https://marcofly.app

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `--fail-with-body` invece di `-f`: su errore stampa il corpo della
      # risposta, che è dove il sito scrive il motivo (`no_db_binding`,
      # `db_error`). Senza, si vedrebbe solo «exit 22» e si tornerebbe a
      # indovinare.
      - name: Fetch stats.json
        run: |
          set -euo pipefail
          mkdir -p DATA
          # `|| { cat …; exit 1; }`: con `-o file` il corpo dell'errore finisce
          # NEL FILE, non a schermo. Senza questo si vedrebbe solo «exit 22» e
          # si tornerebbe a indovinare perché — che è il difetto di partenza.
          curl --fail-with-body -sSL --retry 3 --retry-delay 5 -D /tmp/h.txt \
            "$BASE_URL/api/validation-stats" -o DATA/stats.new.json || {
            echo "::error::fetch fallito — header e corpo della risposta:"
            cat /tmp/h.txt || true
            head -c 800 DATA/stats.new.json || true
            exit 1
          }
          # Deve essere JSON valido E contenere i campi che il repo pubblica:
          # un 200 con un corpo inatteso non è un successo.
          python3 - <<'PY'
          import json, sys
          d = json.load(open('DATA/stats.new.json'))
          for k in ('total_submissions', 'goal_total', 'progress_percent'):
              if k not in d:
                  sys.exit(f"campo mancante in stats.json: {k}")
          json.dump(d, open('DATA/stats.json', 'w'), indent=2, ensure_ascii=False)
          print(f"stats.json ok — {d['total_submissions']} submission, obiettivo {d['goal_total']}")
          PY
          rm -f DATA/stats.new.json

      - name: Fetch supporters.json
        run: |
          set -euo pipefail
          # `|| { cat …; exit 1; }`: con `-o file` il corpo dell'errore finisce
          # NEL FILE, non a schermo. Senza questo si vedrebbe solo «exit 22» e
          # si tornerebbe a indovinare perché — che è il difetto di partenza.
          curl --fail-with-body -sSL --retry 3 --retry-delay 5 -D /tmp/h.txt \
            "$BASE_URL/api/validation-supporters" -o DATA/supporters.new.json || {
            echo "::error::fetch fallito — header e corpo della risposta:"
            cat /tmp/h.txt || true
            head -c 800 DATA/supporters.new.json || true
            exit 1
          }
          python3 - <<'PY'
          import json, sys
          d = json.load(open('DATA/supporters.new.json'))
          if 'supporters' not in d:
              sys.exit("campo mancante in supporters.json: supporters")
          json.dump(d, open('DATA/supporters.json', 'w'), indent=2, ensure_ascii=False)
          print(f"supporters.json ok — {len(d['supporters'])} con consenso pubblico")
          PY
          rm -f DATA/supporters.new.json

      - name: Fetch submissions.csv (open data anonimizzato)
        run: |
          set -euo pipefail
          # `|| { cat …; exit 1; }`: con `-o file` il corpo dell'errore finisce
          # NEL FILE, non a schermo. Senza questo si vedrebbe solo «exit 22» e
          # si tornerebbe a indovinare perché — che è il difetto di partenza.
          curl --fail-with-body -sSL --retry 3 --retry-delay 5 -D /tmp/h.txt \
            "$BASE_URL/api/validation-submissions.csv" -o DATA/submissions.new.csv || {
            echo "::error::fetch fallito — header e corpo della risposta:"
            cat /tmp/h.txt || true
            head -c 800 DATA/submissions.new.csv || true
            exit 1
          }
          # Un file vuoto è un guasto. Un file con la SOLA intestazione invece è
          # legittimo — nessuna submission pubblicabile, oppure righe cancellate
          # su richiesta GDPR — e va accettato: il sito è la fonte, e un dataset
          # che non sa rimpicciolirsi non rispetta il diritto alla cancellazione.
          if [ ! -s DATA/submissions.new.csv ]; then
            echo "::error::submissions.csv scaricato vuoto (0 byte): non sostituisco i dati esistenti"
            exit 1
          fi
          head -1 DATA/submissions.new.csv | grep -q '^id,submitted_at,submitter_hash,' || {
            echo "::error::intestazione CSV inattesa — il contratto con DATA/schema.md è cambiato?"
            head -1 DATA/submissions.new.csv
            exit 1
          }
          mv DATA/submissions.new.csv DATA/submissions.csv
          echo "submissions.csv ok — $(( $(wc -l < DATA/submissions.csv) - 1 )) righe di dati"

      - name: Rigenera la sezione di CONTRIBUTORS.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys

          sup = json.load(open('DATA/supporters.json')).get('supporters', [])
          if sup:
              rows = ["| Nickname | Submission | Badge | Prima | Ultima |", "|---|---|---|---|---|"]
              for s in sorted(sup, key=lambda s: s.get('nickname', '').lower()):
                  rows.append("| {} | {} | {} | {} | {} |".format(
                      s.get('nickname', '?'),
                      s.get('submission_count', 0),
                      s.get('badge', ''),
                      (s.get('first_submission_at') or '—')[:10],
                      (s.get('last_submission_at') or '—')[:10],
                  ))
              table = "\n".join(rows)
          else:
              table = "_Nessun contributor opt-in ancora. Siate i primi!_"

          content = open('CONTRIBUTORS.md', encoding='utf-8').read()
          new, n = re.subn(
              r"<!-- AUTOGEN-START.*?-->.*?<!-- AUTOGEN-END -->",
              "<!-- AUTOGEN-START: do not modify manually. Aggiornato automaticamente via sync-stats.yml -->\n\n"
              + table.replace('\\', '\\\\') + "\n\n<!-- AUTOGEN-END -->",
              content, flags=re.DOTALL,
          )
          # ⚠️ Zero sostituzioni = i marker non ci sono più. Prima veniva
          # inghiottito da un `except Exception: print(...)`, quindi la tabella
          # smetteva di aggiornarsi senza che nessuno lo sapesse: lo stesso
          # difetto del workflow, un livello più in basso.
          if n == 0:
              sys.exit("marker AUTOGEN-START/END non trovati in CONTRIBUTORS.md")
          open('CONTRIBUTORS.md', 'w', encoding='utf-8').write(new)
          print(f"CONTRIBUTORS.md aggiornato — {len(sup)} supporter")
          PY

      - name: Commit se ci sono cambiamenti
        run: |
          set -euo pipefail
          git config user.name "MFF Stats Bot"
          git config user.email "bot@marcofly.app"
          git add DATA/ CONTRIBUTORS.md
          if git diff --cached --quiet; then
            echo "Nessun cambiamento da committare"
          else
            git commit -m "chore(data): sync stats from marcofly.app ($(date -u +%Y-%m-%d))"
            git push
          fi
